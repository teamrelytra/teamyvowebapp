[build]
  publish = "public"

[build.environment]
  NODE_VERSION = "24"

[server]
  path = "/api/*"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
